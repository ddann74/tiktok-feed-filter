name: Android Build

# Compile-check plus the pure-Kotlin unit tests (FilterEngineTest,
# ActionSequenceTest, SkipStreakGuardTest) -- this is the real verification
# for the parts of this app that can't be exercised in the sandboxed dev
# environment this project is often edited in: no Android SDK is reachable
# from there (see docs/*/PROGRESS.md for specifics), so tests written there
# get committed unrun until a workflow like this one actually runs them.
# It does NOT replace on-device verification -- nothing here launches an
# emulator, taps a UI element, or confirms any accessibility-service
# behavior against a real TikTok install.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.5.2 (see build.gradle.kts) requires JDK 17 to run, even though
      # app/build.gradle.kts's own compileOptions target Java 8 bytecode.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pure-Kotlin unit tests (filter/, tiktokactions/) - no Android
      # dependency, no device/emulator needed. Runs before the APK build so
      # a broken test fails fast rather than after a slower full assemble.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # No local.properties / API keys needed - this app has no external
      # service dependency (see README's Privacy section: no internet
      # permission is requested or used anywhere in this app).
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Makes the APK downloadable from this run's page (Summary tab, or
      # the Artifacts section at the bottom of the run's Actions page) --
      # download on your phone's browser and tap the file to sideload it
      # (needs "install from unknown sources" allowed for your browser/
      # files app in Android Settings). This is a debug-signed build for
      # testing only, not a release build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-feed-filter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Surfaces JUnit XML results in the run's summary even though the
      # test step above already fails the job on a real failure - useful
      # for seeing WHICH test failed without digging through raw log output.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
